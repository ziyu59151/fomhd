[project]
name = "fomhd-research"
version = "0.1.0"
description = "FOMHD research and algorithm-validation environment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cupy-cuda13x==14.2.0",
    "numpy==2.5.4",
    "scipy>=1.17,<2",
    "torch==2.14.1",
    "warp-lang==1.19.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9,<10",
]
plot = [
    "matplotlib>=3.10,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests/warp"]
pythonpath = [".", "tests/warp"]
python_files = ["test_*.py", "foundation_*.py"]
