# Default A0 massless quasineutral CGL-B case.
# Scope: bounded local numerical fixture; no global Tokamak validation.

schema_version = 1  # Unit: 1; allowed: integer 1; purpose: select the strict A0 configuration schema; validation: local template, global scope pending
model = "A0"  # Unit: 1; allowed: A0; purpose: select the A0 solver contract; validation: local template, global scope pending
units = "SI"  # Unit: 1; allowed: SI; purpose: require SI input and output units; validation: local template, global scope pending
layout_version = 1  # Unit: 1; allowed: integer 1; purpose: select the A0 state and operator layout; validation: local template, global scope pending
case_name = "massless-example"  # Unit: 1; allowed: safe name using letters, digits, underscore, or hyphen; purpose: identify this local numerical case; validation: local template, global scope pending

[species]
ion_id = "ion"  # Unit: 1; allowed: unique safe species identifier; purpose: name the ion population; validation: local template, global scope pending
electron_id = "electron"  # Unit: 1; allowed: unique safe species identifier different from ion_id; purpose: name the electron population; validation: local template, global scope pending
qi = 1.602176634e-19  # Unit: C; allowed: finite positive ion charge; purpose: set the ion charge; validation: local template, global scope pending
mi = 1.67262192595e-27  # Unit: kg; allowed: finite positive ion mass; purpose: set the ion inertial mass; validation: local template, global scope pending
qe = -1.602176634e-19  # Unit: C; allowed: finite negative electron charge; purpose: set the electron charge; validation: local template, global scope pending
me = 9.1093837139e-31  # Unit: kg; allowed: finite positive physical electron mass; purpose: retain physical electron metadata in the massless model; validation: local template, global scope pending
gamma_i = 1.6666666666666667  # Unit: 1; allowed: finite adiabatic index greater than 1; purpose: set ion pressure closure; validation: local template, global scope pending
electron_inertia = 0  # Unit: 1; allowed: 0 for default massless or 1 for explicit local finite mass; purpose: select quasineutral massless electron dynamics; validation: local template, global scope pending

[grid]
R0 = 1.0  # Unit: m; allowed: finite radial origin; purpose: place the fixture in major-radius coordinates; validation: local template, global scope pending
Z0 = 0.0  # Unit: m; allowed: finite axial origin; purpose: place the fixture in vertical coordinates; validation: local template, global scope pending
hR = 0.2  # Unit: m; allowed: finite positive radial spacing; purpose: set radial grid spacing; validation: local template, global scope pending
hZ = 0.2  # Unit: m; allowed: finite positive axial spacing; purpose: set axial grid spacing; validation: local template, global scope pending
NR = 4  # Unit: 1; allowed: integer at least 2; purpose: set radial node count; validation: local template, global scope pending
NZ = 4  # Unit: 1; allowed: integer at least 2; purpose: set axial node count; validation: local template, global scope pending
K = 1  # Unit: 1; allowed: nonnegative integer; purpose: set maximum retained toroidal mode number; validation: local template, global scope pending
Nphi = 5  # Unit: 1; allowed: positive odd integer at least 4*K+1; purpose: set physical toroidal sample count; validation: local template, global scope pending

[time]
start_time = 0.0  # Unit: s; allowed: finite nonnegative start time; purpose: set the initial scheduler time; validation: local template, global scope pending
dt = 2e-13  # Unit: s; allowed: finite positive explicit step; purpose: resolve the local massless Hall scale; validation: local template, global scope pending
nsteps = 1  # Unit: 1; allowed: nonnegative integer no greater than 2^52; purpose: request one local explicit step; validation: local template, global scope pending
initial_kind = "non_equilibrium"  # Unit: 1; allowed: equilibrium or non_equilibrium; purpose: load the supplied state without an equilibrium solve; validation: local template, global scope pending
integrator = "rk4"  # Unit: 1; allowed: rk4 default or midpoint for an explicit comparison; purpose: select the explicit time integrator; validation: local template, global scope pending
dt_guard = "warn"  # Unit: 1; allowed: error or warn; purpose: record guard exceedance for this demonstration; validation: local template, global scope pending
minimum_samples_per_cycle = 32.0  # Unit: 1; allowed: finite positive sample count; purpose: require time resolution of the fastest estimate; validation: local template, global scope pending
max_amplitude_error = 0.01  # Unit: 1; allowed: finite positive relative error; purpose: bound finite-horizon amplitude error; validation: local template, global scope pending
max_phase_error_rad = 0.1  # Unit: rad; allowed: finite positive phase error; purpose: bound finite-horizon phase error; validation: local template, global scope pending

[boundary]
kind = "fixed_lcfs_static"  # Unit: 1; allowed: fixed_lcfs_static; purpose: select the supported static wall boundary; validation: local template, global scope pending
potential = 0.0  # Unit: V; allowed: 0.0 for this boundary version; purpose: fix the wall potential; validation: local template, global scope pending
version = "staircase_relative_v1"  # Unit: 1; allowed: staircase_relative_v1; purpose: select the supported staircase boundary contract; validation: local template, global scope pending

[solver]
backend = "cpu"  # Unit: 1; allowed: cpu or cuda; purpose: select the execution backend explicitly; validation: local template, global scope pending
precision = "fp64"  # Unit: 1; allowed: fp64; purpose: retain double-precision real storage; validation: local template, global scope pending
complex_precision = "complex128"  # Unit: 1; allowed: complex128; purpose: retain double-precision complex storage; validation: local template, global scope pending
memory_limit_bytes = 536870912  # Unit: B; allowed: positive bounded integer; purpose: cap host solver allocation; validation: local template, global scope pending
device_memory_limit_bytes = 536870912  # Unit: B; allowed: positive bounded integer; purpose: cap selected-device allocation; validation: local template, global scope pending
rank_rtol = 1e-12  # Unit: 1; allowed: finite positive value below 1; purpose: set numerical rank detection; validation: local template, global scope pending
device_ordinal = 0  # Unit: 1; allowed: 0 for CPU or a valid CUDA ordinal; purpose: select CPU or one explicit CUDA device; validation: local template, global scope pending
cpu_threads = 1  # Unit: 1; allowed: integer 1; purpose: require deterministic one-thread reference reductions; validation: local template, global scope pending

[solver.constants]
epsilon0_Fpm = 8.8541878188e-12  # Unit: F/m; allowed: finite positive permittivity; purpose: set the electrostatic constant; validation: local template, global scope pending
mu0_Hpm = 1.25663706127e-06  # Unit: H/m; allowed: finite positive permeability; purpose: set the magnetic constant; validation: local template, global scope pending
version = "A0-SI-v1"  # Unit: 1; allowed: nonempty provenance label; purpose: identify the SI constant set; validation: local template, global scope pending

[solver.references]
L_m = 0.2  # Unit: m; allowed: finite positive length; purpose: set the nondimensionalization length; validation: local template, global scope pending
t_s = 1e-06  # Unit: s; allowed: finite positive time; purpose: set the nondimensionalization time; validation: local template, global scope pending
n_i_m3 = 1000000000000.0  # Unit: 1/m^3; allowed: finite positive ion density; purpose: set the ion density scale; validation: local template, global scope pending
n_e_m3 = 1000000000000.0  # Unit: 1/m^3; allowed: finite positive electron density; purpose: set the electron density scale; validation: local template, global scope pending
u_mps = 1.0  # Unit: m/s; allowed: finite positive velocity; purpose: set the velocity scale; validation: local template, global scope pending
E_Vpm = 1.0  # Unit: V/m; allowed: finite positive electric field; purpose: set the electric-field scale; validation: local template, global scope pending
B_T = 1e-05  # Unit: T; allowed: finite positive magnetic field; purpose: set the magnetic-field scale; validation: local template, global scope pending
J_Apm2 = 1000.0  # Unit: A/m^2; allowed: finite positive current density; purpose: set the current-density scale; validation: local template, global scope pending
rho_Cpm3 = 1e-07  # Unit: C/m^3; allowed: finite positive charge density; purpose: set the charge-density scale; validation: local template, global scope pending
p_Pa = 1e-09  # Unit: Pa; allowed: finite positive pressure; purpose: set the pressure scale; validation: local template, global scope pending

[budgets.domain]
n_min_i = 0.0  # Unit: 1/m^3; allowed: finite nonnegative floor; purpose: set the ion density positivity floor; validation: local template, global scope pending
n_min_e = 0.0  # Unit: 1/m^3; allowed: finite nonnegative floor; purpose: set the electron density positivity floor; validation: local template, global scope pending
n_face_min_i = 0.0  # Unit: 1/m^3; allowed: finite nonnegative floor; purpose: set the ion face-density positivity floor; validation: local template, global scope pending
n_face_min_e = 0.0  # Unit: 1/m^3; allowed: finite nonnegative floor; purpose: set the electron face-density positivity floor; validation: local template, global scope pending
p_min_i = 0.0  # Unit: Pa; allowed: finite nonnegative floor; purpose: set the ion pressure positivity floor; validation: local template, global scope pending
p_min_perp_e = 0.0  # Unit: Pa; allowed: finite nonnegative floor; purpose: set the perpendicular electron pressure floor; validation: local template, global scope pending
p_min_parallel_e = 0.0  # Unit: Pa; allowed: finite nonnegative floor; purpose: set the parallel electron pressure floor; validation: local template, global scope pending
B_min = 1e-12  # Unit: T; allowed: finite nonnegative floor; purpose: retain a nonzero magnetic field for quasineutral closure; validation: local template, global scope pending

